<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="home.css">
    <title>Главная</title>
</head>
<script src="script.js"></script>

<div class="home-page">
    <nav class="sidebar">
        <ul class="sidebar__list">
            <li class="sidebar__item">
                <img src="./images/home.png" alt="Иконка" class="sidebar__icon">
            </li>
            <li class="sidebar__item">
                <img src="./images/person.png" alt="Иконка" class="sidebar__icon">
            </li>
            <li class="sidebar__item">
                <img src="./images/plus.png" alt="Иконка" class="sidebar__icon">
            </li>
        </ul>
    </nav>

    <main class="feed">
        <article class="post">
            <div class="post__header">
                <img src="./images/profile.png" alt="Фото" class="post__pfp">
                <span class="post__author-name">Ваня Денисов</span>
                <button class="post__action-button">
                    <img src="./images/edit.png" alt="Изменить" class="post__edit-icon">
                </button>
            </div>

            <img src="./images/post_image_1.png" alt="Пост" class="post__image">

            <div class="post__actions">
                <button class="post__action-button">
                    <img src="./images/like.png" alt="Лайк" class="like__icon">
                </button>
            </div>

            <div class="post__comment">
                <span class="post__comment-content" data-full-text="Так красиво сегодня на улице! Настоящая зима)) Вспоминается Бродский: «Поздно ночью, в уснувшей долине, на самом дне, в городке, занесенном снегом по ручку двери...» ">
                    Так красиво сегодня на улице! Настоящая зима)) Вспоминается Бродский: «Поздно ночью, в уснувшей долине, на самом дне, в городке, занесенном снегом по ручку двери...» 
                </span>
                <button class="post__text-button" type="button">еще</button>
            </div>
            <div class="post__comment">
                <span class="post__text-button">2 часа назад</span>
            </div>
        </article>

        <article class="post">
            <div class="post__header">
                <img src="./images/avatar.png" alt="Фото" class="post__pfp">
                <span class="post__author-name">Лиза Дёмина</span>
            </div>

            <img src="./images/post_image_2.png" alt="Пост" class="post__image">

            <div class="post__actions">
                <button class="post__action-button">
                    <img src="./images/like.png" alt="Лайк" class="like__icon">
                </button>
            </div>

            <div class="post__comment">
                <span class="post__text-button">3 часа назад</span>
            </div>
        </article>
    </main>

    <aside class="recommendations">
        </aside>
</div>
</html>
