<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="profile.css">
    <title>Профиль</title>
</head>

<div class="profile-page">
    <nav class="sidebar">
        <ul class="sidebar__list">
            <li class="sidebar__item">
                <img src="./images/home.png" alt="Иконка" class="sidebar__icon">
            </li>
            <li class="sidebar__item">
                <img src="./images/person.png" alt="Иконка" class="sidebar__icon">
            </li>
            <li class="sidebar__item">
                <img src="./images/plus.png" alt="Иконка" class="sidebar__icon">
            </li>
        </ul>
    </nav>

    <main class="profile-content">
    <header class="profile-header">
        <img src="./images/profile.png" alt="Аватар" class="profile-avatar">
        <h1 class="profile-name">Ваня Денисов</h1>
        <p class="profile-bio">Привет! Я системный аналитик в ACME :) Тут моя жизнь только для самых классных!</p>
        <div class="profile-stats-container">
            <button class="profile-stats-button">
                <img src="./images/posts.png" alt="Посты" class="stats-icon">
            </button>
        </div>
    </header>

    <section class="profile-posts">
        <div class="profile-post-item"><img src="./images/post_image_1.png" alt="Пост"></div>
        <div class="profile-post-item"><img src="./images/post_image_2.png" alt="Пост"></div>
        <div class="profile-post-item"><img src="./images/post_image_3.png" alt="Пост"></div>
        <div class="profile-post-item"><img src="./images/post_image_4.png" alt="Пост"></div>
        <div class="profile-post-item"><img src="./images/post_image_5.png" alt="Пост"></div>
        <div class="profile-post-item"><img src="./images/post_image_6.png" alt="Пост"></div>
        <div class="profile-post-item"><img src="./images/post_image_7.png" alt="Пост"></div>
        <div class="profile-post-item"><img src="./images/post_image_8.png" alt="Пост"></div>
        <div class="profile-post-item"><img src="./images/post_image_9.png" alt="Пост"></div>

    </section>
    </main>
</div>
</html>
